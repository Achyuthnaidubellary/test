name: Terraform Case Sensitivity - With Workaround

on:
  workflow_dispatch:

env:
  # Fetch from GitHub environment variables (set in Settings -> Environments -> test)
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION || 'us-west-2' }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'default-cluster' }}

jobs:
  terraform-with-workaround:
    name: Test with Case Transformation Workaround
    runs-on: ubuntu-latest
    environment: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Display Original GitHub Env Vars
        run: |
          echo "=== Original GitHub Environment Variables ==="
          echo "ENVIRONMENT_NAME=${{ vars.ENVIRONMENT_NAME }}"
          echo "PROJECT_ID=${{ vars.PROJECT_ID }}"
          echo "TF_VAR_NAME=${{ vars.TF_VAR_NAME }}"
          echo "TF_VAR_ENVIRONMENT_NAME=${{ vars.TF_VAR_ENVIRONMENT_NAME }}"
          echo "TF_VAR_PROJECT_ID=${{ vars.TF_VAR_PROJECT_ID }}"
          echo ""
      
      - name: Transform ALL TF_VAR_* to lowercase
        run: |
          echo "=== Transforming TF_VAR_* variables to lowercase ==="
          
          # Transform TF_VAR_NAME -> TF_VAR_name
          if [ -n "${{ vars.TF_VAR_NAME }}" ]; then
            echo "TF_VAR_name=${{ vars.TF_VAR_NAME }}" >> $GITHUB_ENV
            echo "✅ TF_VAR_NAME -> TF_VAR_name = ${{ vars.TF_VAR_NAME }}"
          fi
          
          # Transform TF_VAR_ENVIRONMENT_NAME -> TF_VAR_environment_name
          if [ -n "${{ vars.TF_VAR_ENVIRONMENT_NAME }}" ]; then
            echo "TF_VAR_environment_name=${{ vars.TF_VAR_ENVIRONMENT_NAME }}" >> $GITHUB_ENV
            echo "✅ TF_VAR_ENVIRONMENT_NAME -> TF_VAR_environment_name = ${{ vars.TF_VAR_ENVIRONMENT_NAME }}"
          fi
          
          # Transform TF_VAR_PROJECT_ID -> TF_VAR_project_id  
          if [ -n "${{ vars.TF_VAR_PROJECT_ID }}" ]; then
            echo "TF_VAR_project_id=${{ vars.TF_VAR_PROJECT_ID }}" >> $GITHUB_ENV
            echo "✅ TF_VAR_PROJECT_ID -> TF_VAR_project_id = ${{ vars.TF_VAR_PROJECT_ID }}"
          fi
          
          # Also transform regular UPPERCASE vars
          if [ -n "${{ vars.ENVIRONMENT_NAME }}" ]; then
            echo "TF_VAR_environment_name=${{ vars.ENVIRONMENT_NAME }}" >> $GITHUB_ENV
            echo "TF_VAR_ENVIRONMENT_NAME=${{ vars.ENVIRONMENT_NAME }}" >> $GITHUB_ENV
            echo "✅ ENVIRONMENT_NAME -> TF_VAR_environment_name = ${{ vars.ENVIRONMENT_NAME }}"
          fi
          
          if [ -n "${{ vars.PROJECT_ID }}" ]; then
            echo "TF_VAR_project_id=${{ vars.PROJECT_ID }}" >> $GITHUB_ENV
            echo "TF_VAR_PROJECT_ID=${{ vars.PROJECT_ID }}" >> $GITHUB_ENV
            echo "✅ PROJECT_ID -> TF_VAR_project_id = ${{ vars.PROJECT_ID }}"
          fi
          
          echo ""
      
      - name: Verify Transformed Variables
        run: |
          echo "=== Transformed TF_VAR_ Variables ==="
          env | grep TF_VAR_ | sort
          echo ""
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: |
          echo "=== Running Terraform Plan ==="
          terraform plan -no-color
      
      - name: Terraform Apply
        run: |
          echo "=== Running Terraform Apply ==="
          terraform apply -auto-approve -no-color
      
      - name: Display Results
        run: |
          echo "=== Terraform Outputs ==="
          terraform output -json | jq '.'
          echo ""
          echo "=== Test Results File ==="
          cat terraform-output.txt
          echo ""
      
      - name: Success Summary
        run: |
          echo "✅ WORKAROUND SUCCESSFUL!"
          echo ""
          echo "Solution: Transform UPPERCASE GitHub vars to lowercase TF_VAR_ format"
          echo "Method: Use bash parameter expansion \${VAR,,} to convert to lowercase"
          echo ""
          echo "Example:"
          echo "  ENVIRONMENT_NAME='PROD' → TF_VAR_environment_name='prod'"
          echo ""
          echo "This allows you to:"
          echo "  1. Keep UPPERCASE convention in GitHub environment variables"
          echo "  2. Use lowercase (best practice) in Terraform variable definitions"
          echo "  3. Transform between them in the workflow"
      
      - name: Cleanup
        if: always()
        run: terraform destroy -auto-approve -no-color || true
