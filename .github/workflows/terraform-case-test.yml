name: Terraform Case Sensitivity Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Fetch from GitHub environment variables (set in Settings -> Environments -> test)
  TF_VAR_ENVIRONMENT_NAME: ${{ vars.TF_VAR_ENVIRONMENT_NAME }}
  TF_VAR_PROJECT_ID: ${{ vars.TF_VAR_PROJECT_ID }}
  TF_VAR_NAME: ${{ vars.TF_VAR_NAME }}
  ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
  PROJECT_ID: ${{ vars.PROJECT_ID }}

jobs:
  terraform-case-test:
    name: Test Terraform Variable Case Sensitivity
    runs-on: ubuntu-latest
    environment: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Display Original GitHub Environment Variables
        run: |
          echo "=== Original GitHub Environment Variables (from 'test' environment) ==="
          echo "TF_VAR_ENVIRONMENT_NAME: ${{ vars.TF_VAR_ENVIRONMENT_NAME }}"
          echo "TF_VAR_PROJECT_ID: ${{ vars.TF_VAR_PROJECT_ID }}"
          echo "TF_VAR_NAME: ${{ vars.TF_VAR_NAME }}"
          echo ""
      
      - name: Transform TF_VAR_* to lowercase
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          set -euo pipefail

          echo "🔄 Transforming TF_VAR_* variables to lowercase..."
          
          # Count variables
          total_vars=$(echo "$VARS_JSON" | jq '[to_entries[] | select(.key | startswith("TF_VAR_"))] | length')
          
          if [ "$total_vars" -eq 0 ]; then
            echo "⚠️  No TF_VAR_* variables found in environment"
            exit 0
          fi
          
          echo "📦 Processing $total_vars variable(s)..."
          echo ""
          
          # Transform each TF_VAR_* variable to lowercase
          echo "$VARS_JSON" | jq -c 'to_entries[] | select(.key | startswith("TF_VAR_"))' | while IFS= read -r entry; do
            var_name=$(echo "$entry" | jq -r '.key')
            var_value=$(echo "$entry" | jq -r '.value')
            
            # Extract suffix and convert to lowercase
            suffix="${var_name#TF_VAR_}"
            lowercase_suffix=$(echo "$suffix" | tr '[:upper:]' '[:lower:]')
            new_var_name="TF_VAR_${lowercase_suffix}"
            
            # Export using heredoc for multiline/JSON safety
            {
              echo "${new_var_name}<<GITHUB_ENV_EOF"
              echo "${var_value}"
              echo "GITHUB_ENV_EOF"
            } >> $GITHUB_ENV
            
            # Log transformation (truncate long values)
            if [ ${#var_value} -gt 100 ]; then
              display_value="${var_value:0:97}..."
            else
              display_value="$var_value"
            fi
            
            echo "  ✓ ${var_name} → ${new_var_name}"
            echo "    ${display_value}"
          done
          
          echo ""
          echo "✅ Successfully transformed $total_vars variable(s)"
      - name: Show Transformed Variables
        run: |
          echo ""
          echo "Transformed variables:"
          env | grep "^TF_VAR_" | grep "^TF_VAR_[a-z]" | sort
          echo ""
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        run: |
          echo "=== Running Terraform Plan ==="
          terraform plan -no-color
      
      - name: Terraform Apply
        run: |
          echo "=== Running Terraform Apply ==="
          terraform apply -auto-approve -no-color
      
      - name: Display Terraform Outputs
        run: |
          echo "=== Terraform Outputs ==="
          terraform output -json | jq '.'
      
      - name: Show Test Results File
        run: |
          echo "=== Test Results from File ==="
          cat terraform-output.txt
          echo ""
      
      - name: Test Summary
        run: |
          echo "=== Test Summary ==="
          echo "This workflow tests the REAL SCENARIO:"
          echo "GitHub env vars are UPPERCASE, but Terraform vars are lowercase"
          echo ""
          echo "Expected behavior:"
          echo "- TF_VAR_ENVIRONMENT_NAME will NOT set 'environment_name' (case mismatch)"
          echo "- TF_VAR_environment_name WILL set 'environment_name' (exact match)"
          echo "- Lowercase Terraform variables require exact case match in TF_VAR_"
          echo ""
          echo "WORKAROUND: Use lowercase in GitHub env vars or transform in workflow"
          echo "Check the outputs above to see which variables got set."
      
      - name: Upload Terraform Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-test-results
          path: |
            terraform-output.txt
            terraform.tfstate
          retention-days: 7
      
      - name: Cleanup
        if: always()
        run: |
          terraform destroy -auto-approve -no-color || true
